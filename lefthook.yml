# Zakadi repository standard: git hooks (lefthook 2.x) for the Python client.
# The commands are the ones .github/workflows/ci.yml runs. Install: uv sync, then
# uv run lefthook install (lefthook is a dev dependency).

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "{.env*,**/.env*}"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    # Alone and first: uv run re-locks as a side effect, so a stale lockfile is caught
    # before a parallel job repairs it silently.
    - name: lock
      run: uv lock --check
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: "*.py"
            run: uv run --frozen ruff format --check {staged_files}
          - name: lint
            glob: "*.py"
            run: uv run --frozen ruff check {staged_files}

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: types
      run: uv run --frozen ty check
    - name: unit
      run: uv run --frozen python -m unittest discover -s tests
