openapi: 3.1.0
info:
  title: Zakadi API
  version: 1.0.0
  description: >-
    The server-to-server API of Zakadi (spec/02-api.md): sessions, results, webhooks,
    tenant policy and usage, the SDK configuration and telemetry, health and the JWKS.
    This document is the source of truth (D84): the `api` service's handlers and the
    Python and Node clients are generated from it. Bodies are JSON in UTF-8 over TLS,
    every response carries `Zakadi-Request-Id`, and errors are RFC 9457 problems
    (`application/problem+json`) whose `code` is one of the values of 2.9.
servers:
  - url: https://api.zakadi.dev
security:
  - bearer: []
tags:
  - name: Sessions
    description: Create, list, read and cancel liveness sessions (2.2).
  - name: Results
    description: Verdicts, evidence, deletion and deletion jobs (2.3).
  - name: Webhooks
    description: Webhook endpoints, their delivery attempts and the deliveries themselves (2.4).
  - name: Tenants
    description: Tenant policy (2.5) and usage (2.7).
  - name: SDK
    description: Public endpoints the SDKs call without a key (2.6, 2.10).
  - name: Health
    description: Control plane liveness and ingest health (2.7).
  - name: Keys
    description: The public keys that verify client and result tokens (2.8).

paths:
  /v1/sessions:
    parameters:
      - $ref: '#/components/parameters/ZakadiSignature'
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a session
      description: >-
        Creates a session for one end user. The RP passes `client_token`, `ingest`,
        `prompt_pack` and `ui` to the SDK unchanged and never logs the token. The same
        `Idempotency-Key` with the same body returns the original response for 24 h;
        with a different body the answer is 422 `idempotency_conflict`.
        `evidence.clip` needs the tenant policy's `evidence_clip_allowed`. Rate
        limited per key: 600 requests per minute by default, tenant-configurable.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The session to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              user_ref: cust-88213
              locale: en-NG
              channel: android
              device_correlation_id: dev-4b7e1c90
              policy:
                version: 12
                overrides:
                  min_actions: 2
                  languages: [en-NG, fr-CI]
              ingest_hint:
                country: NG
              callback:
                url: https://rp.example/liveness/hook
                secret_ref: wh_sec_01
              metadata:
                flow: onboarding
                attempt: 1
              evidence:
                audit_frames: true
                clip: false
                retention_days: 7
      responses:
        '201':
          description: The session was created.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
              example:
                session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
                client_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImNwLTIwMjYtMDkiLCJ0eXAiOiJKV1QifQ..K2gjooCNvv5KTzNa6EchwiZ0aKJq7Qu33EHJ_vaQ7kCD_Poyaaj77XNZdMevEsPR_Rb7U0KW9ejM-ixOcycuWw
                expires_at: '2026-09-22T10:05:00Z'
                ingest:
                  - region: eu-west-2
                    url: wss://ingest-euw2.zakadi.dev/v1/sessions/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/stream
                  - region: af-south-1
                    url: wss://ingest-afs1.zakadi.dev/v1/sessions/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/stream
                prompt_pack:
                  lang: en-NG
                  version: '2026.09.1'
                  url: https://cdn.zakadi.dev/packs/en-NG/2026.09.1/manifest.json
                ui:
                  consent_copy:
                    en-NG:
                      title: A short video check
                      body: >-
                        We will ask you to follow two short prompts on camera to confirm
                        that you are present.
                      recording_notice: Two still frames from this call are kept for 7 days for audit.
                  brand:
                    primary: '#0A5'
                    logo_url: null
                  badge_text: null
                  packs:
                    - lang: en-NG
                      version: '2026.09.1'
                      url: https://cdn.zakadi.dev/packs/en-NG/2026.09.1/manifest.json
                    - lang: fr-CI
                      version: '2026.09.1'
                      url: https://cdn.zakadi.dev/packs/fr-CI/2026.09.1/manifest.json
                policy_version: 12
                status: created
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '422':
          $ref: '#/components/responses/UnprocessableSession'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List sessions
      description: >-
        Lists the tenant's sessions newest first, one page at a time; `next_cursor`
        fetches the next page and is null on the last. Rate limited per key: 3,000
        GET requests per minute.
      parameters:
        - name: user_ref
          in: query
          required: false
          description: Only sessions created for this end-user reference.
          schema:
            type: string
            minLength: 1
          example: cust-88213
        - name: status
          in: query
          required: false
          description: Only sessions in this status.
          schema:
            $ref: '#/components/schemas/SessionStatus'
          example: passed
        - name: from
          in: query
          required: false
          description: Only sessions created at or after this time.
          schema:
            type: string
            format: date-time
          example: '2026-09-22T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Only sessions created before this time.
          schema:
            type: string
            format: date-time
          example: '2026-09-23T00:00:00Z'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions, newest first.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              example:
                data:
                  - session_id: ses_01J8ZQ8B4D6F8H0K2N4Q6S8V0X
                    status: expired
                    created_at: '2026-09-22T12:00:00Z'
                    connected_at: null
                    ended_at: '2026-09-22T12:15:00Z'
                    verdict_at: '2026-09-22T12:15:00Z'
                    policy_version: 12
                    channel: web
                    ingest_region: null
                    band: null
                    metadata:
                      flow: onboarding
                      attempt: 1
                  - session_id: ses_01J8ZQ7A3C5E7G9J1M3P5R7T9V
                    status: aborted
                    created_at: '2026-09-22T11:14:30Z'
                    connected_at: '2026-09-22T11:14:48Z'
                    ended_at: '2026-09-22T11:15:20Z'
                    verdict_at: '2026-09-22T11:15:39Z'
                    policy_version: 12
                    channel: android
                    ingest_region: af-south-1
                    band: A
                    metadata:
                      flow: onboarding
                      attempt: 2
                  - session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
                    status: passed
                    created_at: '2026-09-22T10:00:00Z'
                    connected_at: '2026-09-22T10:00:21Z'
                    ended_at: '2026-09-22T10:00:58Z'
                    verdict_at: '2026-09-22T10:01:12Z'
                    policy_version: 12
                    channel: android
                    ingest_region: af-south-1
                    band: A
                    metadata:
                      flow: onboarding
                      attempt: 1
                next_cursor: c2VzXzAxSjhaUTRYS0QzTTdWMk45QjZUNVI4VzFI
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'

  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ZakadiSignature'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Get a session
      description: >-
        Returns the session's status and timestamps. Rate limited per key: 3,000 GET
        requests per minute.
      responses:
        '200':
          description: The session.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
                status: passed
                created_at: '2026-09-22T10:00:00Z'
                connected_at: '2026-09-22T10:00:21Z'
                ended_at: '2026-09-22T10:00:58Z'
                verdict_at: '2026-09-22T10:01:12Z'
                policy_version: 12
                channel: android
                ingest_region: af-south-1
                band: A
                metadata:
                  flow: onboarding
                  attempt: 1
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '404':
          $ref: '#/components/responses/SessionNotFoundLimited'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'
    delete:
      operationId: purgeSession
      tags: [Results]
      summary: Purge a session's data
      description: >-
        Purges the session's evidence, embeddings and media-derived data at once and
        marks its result `purged`; the decision and timestamps are kept for 30 days for
        billing and dispute handling, then deleted.
      responses:
        '202':
          description: The purge was accepted.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ZakadiSignature'
    post:
      operationId: cancelSession
      tags: [Sessions]
      summary: Cancel a session
      description: >-
        Cancels a session that has not ended; if it is connected, the edge sends `end
        aborted user_cancel` (reason `rp_cancel`).
      responses:
        '200':
          description: The cancelled session.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: ses_01J8ZQ7A3C5E7G9J1M3P5R7T9V
                status: aborted
                created_at: '2026-09-22T11:14:30Z'
                connected_at: '2026-09-22T11:14:48Z'
                ended_at: '2026-09-22T11:15:20Z'
                verdict_at: null
                policy_version: 12
                channel: android
                ingest_region: af-south-1
                band: null
                metadata:
                  flow: onboarding
                  attempt: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionNotCancellable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{id}/result:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ZakadiSignature'
    get:
      operationId: getResult
      tags: [Results]
      summary: Get a session's result
      description: >-
        Returns the verdict. Until it exists the answer is 404 with code
        `result_pending`: poll with backoff or use webhooks. RPs act on `decision` and
        `band`; `confidence` is for analytics. Raw sub-scores are in `getEvidence`.
        Rate limited per key: 3,000 GET requests per minute.
      responses:
        '200':
          description: The session's result.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
                decision: pass
                band: A
                confidence: 0.97
                reason_codes: [ACTIONS_OK, PAD_OK, NONCE_OK, TIMING_OK]
                reasons_detail:
                  - code: NONCE_WEAK
                    severity: info
                    text: illumination response weak; outdoor session
                challenges:
                  - id: a1
                    kind: head_turn
                    result: pass
                    attempts: 1
                    latency_ms: 640
                  - id: a2
                    kind: fingers
                    result: pass
                    attempts: 2
                    latency_ms: 910
                quality:
                  lighting: ok
                  face_size: ok
                  network_rung_median: 2
                  received_fps_median: 14.6
                device:
                  platform: android
                  attested: true
                  attestation_verdict: MEETS_DEVICE_INTEGRITY
                models:
                  pad_trunk: dinov2b-reg-pad@1.3.0+d41d8
                  digital_head: digital-head@1.1.0+9e107
                  fusion: fusion@0.9.2
                  landmarks: mediapipe-face-0.10.31
                policy_version: 12
                verdict_at: '2026-09-22T10:01:12Z'
                evidence:
                  audit_frames: 2
                  clip: false
                  expires_at: '2026-09-29T10:01:12Z'
                metadata:
                  flow: onboarding
                  attempt: 1
                result_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImNwLTIwMjYtMDkiLCJ0eXAiOiJKV1QifQ..fA5Log6gG6Dz0fepyH8WTDE5ftLkF-xC1a6QLPZH2wBnyOOlWxZnb1N44Mb83a5pdhcraBLpa96Y1e3dfevsLA
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '404':
          $ref: '#/components/responses/ResultNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'

  /v1/sessions/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ZakadiSignature'
    get:
      operationId: getEvidence
      tags: [Results]
      summary: Get a session's evidence
      description: >-
        Scope `evidence:read`. Returns the sub-scores, forensic scalars, timing
        distributions, the per-challenge score tables, and signed URLs valid for 15
        minutes for the audit frames and the clip if one was kept. Every call is
        written to the audit log with the caller's key id. Rate limited per key: 3,000
        GET requests per minute.
      responses:
        '200':
          description: The session's evidence.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEvidence'
              example:
                session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
                scores:
                  pad_ensemble: 0.991
                  nonce_reader: 0.62
                  probe_classifier: 0.97
                forensics:
                  qp_mean: 27.4
                  idr_interval_ms: 2003
                  pts_rx_correlation: 0.93
                timing:
                  action_latency_ms:
                    p50: 775
                    max: 910
                  clock_drift_ms_per_s: 0.4
                challenges:
                  - idx: 0
                    id: a1
                    kind: head_turn
                    params:
                      direction: user_left
                      min_deg: 20
                      hold_ms: 200
                    result: pass
                    attempts: 1
                    latency_ms: 640
                    scores:
                      geometry: 0.98
                      pad_ensemble: 0.993
                  - idx: 1
                    id: a2
                    kind: fingers
                    params:
                      count: 3
                      hand: either
                      placement: beside_face
                    result: pass
                    attempts: 2
                    latency_ms: 910
                    scores:
                      geometry: 0.95
                      pad_ensemble: 0.989
                audit_frames:
                  - url: https://objects-afs1.zakadi.dev/evidence/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/frame-1?expires=1790073000&signature=7d1c0e5a9b3f
                    expires_at: '2026-09-22T10:30:00Z'
                  - url: https://objects-afs1.zakadi.dev/evidence/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/frame-2?expires=1790073000&signature=2b8e4f6a1c9d
                    expires_at: '2026-09-22T10:30:00Z'
                clip: null
                expires_at: '2026-09-29T10:01:12Z'
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '404':
          $ref: '#/components/responses/SessionNotFoundLimited'
        '410':
          $ref: '#/components/responses/EvidenceExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'

  /v1/subjects/purge:
    parameters:
      - $ref: '#/components/parameters/ZakadiSignature'
    post:
      operationId: purgeSubject
      tags: [Results]
      summary: Purge everything held for an end user
      description: >-
        Data-subject deletion: purges everything held for `user_ref` across sessions.
        `getJob` reports when the job completes.
      requestBody:
        description: The end user whose data is purged.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPurge'
            example:
              user_ref: cust-88213
      responses:
        '202':
          description: The purge job was accepted.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                job_id: job_01J8ZQ9C2F6G4H7J8K9M0N1P2Q
                kind: subject_purge
                status: pending
                created_at: '2026-09-22T13:00:00Z'
                completed_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobIdPath'
      - $ref: '#/components/parameters/ZakadiSignature'
    get:
      operationId: getJob
      tags: [Results]
      summary: Get a job
      description: >-
        Reports the state of a job `purgeSubject` started. Rate limited per key: 3,000
        GET requests per minute.
      responses:
        '200':
          description: The job.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                job_id: job_01J8ZQ9C2F6G4H7J8K9M0N1P2Q
                kind: subject_purge
                status: succeeded
                created_at: '2026-09-22T13:00:00Z'
                completed_at: '2026-09-22T13:00:41Z'
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '401':
          $ref: '#/components/responses/UnauthorizedLimited'
        '403':
          $ref: '#/components/responses/ForbiddenLimited'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'

  /v1/webhooks:
    parameters:
      - $ref: '#/components/parameters/ZakadiSignature'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: >-
        Registers an endpoint for session events; a tenant has at most 5. The same
        `Idempotency-Key` with the same body returns the original response for 24 h;
        with a different body the answer is 422 `idempotency_conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The endpoint to register.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            example:
              url: https://rp.example/liveness/hook
              events: [zakadi.session.completed, zakadi.session.aborted, zakadi.session.expired]
              secret: 5scJWszxU8haiavas08P_6vYYYT1bt472Ucz0kWD
              active: true
      responses:
        '201':
          description: The endpoint was created.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
              example:
                webhook_id: 0b7c1d2e-3f40-4a5b-8c6d-7e8f9a0b1c2d
                url: https://rp.example/liveness/hook
                events: [zakadi.session.completed, zakadi.session.aborted, zakadi.session.expired]
                secret_ref: wh_sec_01
                active: true
                created_at: '2026-09-21T16:40:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WebhookLimit'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
