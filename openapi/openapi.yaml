components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        An API key, `zk_<env>_<32 random base62>`, created per tenant with scopes
        (`sessions:write`, `sessions:read`, `results:read`, `evidence:read`,
        `policy:write`, `webhooks:write`), an optional IP allowlist and an expiry; two
        keys per tenant are active at once for rotation.

  parameters:
    SessionIdPath:
      name: id
      in: path
      required: true
      description: The session id `createSession` returned.
      schema:
        $ref: '#/components/schemas/SessionId'
      example: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
    JobIdPath:
      name: id
      in: path
      required: true
      description: The job id `purgeSubject` returned.
      schema:
        $ref: '#/components/schemas/JobId'
      example: job_01J8ZQ9C2F6G4H7J8K9M0N1P2Q
    WebhookIdPath:
      name: id
      in: path
      required: true
      description: The endpoint's `webhook_id`.
      schema:
        type: string
        format: uuid
      example: 0b7c1d2e-3f40-4a5b-8c6d-7e8f9a0b1c2d
    TenantIdPath:
      name: id
      in: path
      required: true
      description: The caller's tenant id; another tenant's id is refused with 403 `forbidden_scope`.
      schema:
        type: string
        format: uuid
      example: 4f1c2d3e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        At most 128 characters. The same key with the same body returns the original
        response for 24 h; with a different body, 422 `idempotency_conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: onb-88213-1
    ZakadiSignature:
      name: Zakadi-Signature
      in: header
      required: false
      description: >-
        Optional request signing for high-assurance tenants:
        `t=<unix>,v1=<hex hmac-sha256(secret, t + "." + method + "." + path + "." + sha256(body))>`,
        refused when `t` is more than 300 s from server time.
      schema:
        type: string
        pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'
      example: t=1790071200,v1=b9efcd66c3496bdcf50c604f07b1112b006fd8e3d7b71551a492ec60360b686e
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; absent for the first page.
      schema:
        type: string
        minLength: 1
      example: c2VzXzAxSjhaUTRYS0QzTTdWMk45QjZUNVI4VzFI
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    WebhookEventId:
      name: Zakadi-Webhook-Id
      in: header
      required: true
      description: >-
        The event `id`, equal to the body's `id`; this header value is the `id` the
        signature covers (D71).
      schema:
        $ref: '#/components/schemas/EventId'
      example: evt_01J8ZQ6N2P4R6T8V0X2Z4B6D8F
    WebhookTimestamp:
      name: Zakadi-Webhook-Timestamp
      in: header
      required: true
      description: Unix seconds when the delivery was signed; receivers reject one older than 300 s.
      schema:
        type: integer
        minimum: 0
      example: 1790071273
    WebhookSignature:
      name: Zakadi-Webhook-Signature
      in: header
      required: true
      description: >-
        `v1=` and the hex HMAC-SHA256 under the endpoint's secret of
        `<Zakadi-Webhook-Id>.<Zakadi-Webhook-Timestamp>.<raw body>`.
      schema:
        type: string
        pattern: '^v1=[0-9a-f]{64}$'
      example: v1=7e8dace60c872e15c1ee8fdca6fcbe64f6e5fef8eeb2a27a920fe29fadbba0e0

  headers:
    RequestId:
      description: Identifies the request for logs and support; a problem's `request_id` carries the same value.
      required: true
      schema:
        type: string
        minLength: 1
      example: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    RateLimitLimit:
      description: >-
        Requests allowed in the current window: per key, by default 600 per minute on
        `createSession` (tenant-configurable) and 3,000 per minute on GET; per session
        id and IP on `sendTelemetry`.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 600
    RateLimitRemaining:
      description: Requests left in the current window.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 599
    RateLimitReset:
      description: Seconds until the current window resets.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 42
    RateLimitLimitOptional:
      description: >-
        Requests allowed in the current window, present when the request's bucket was
        read before this answer; a 400, 401, 403 or 500 answered before it carries none
        of the RateLimit fields (D106).
      required: false
      schema:
        type: integer
        minimum: 0
      example: 3000
    RateLimitRemainingOptional:
      description: Requests left in the current window, present when the request's bucket was read before this answer (D106).
      required: false
      schema:
        type: integer
        minimum: 0
      example: 2999
    RateLimitResetOptional:
      description: Seconds until the current window resets, present when the request's bucket was read before this answer (D106).
      required: false
      schema:
        type: integer
        minimum: 0
      example: 1
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 42

  responses:
    DeliveryAccepted:
      description: >-
        The receiver's answer. Any 2xx acknowledges the delivery; any other status, or
        no answer within 10 s, is retried after 1 min, 5 min, 30 min, 2 h, 6 h and 24 h.
    BadRequest:
      description: The request does not match the schema (`validation_error`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/validation_error
            title: Validation error
            status: 400
            detail: 'events: at least one event is required'
            code: validation_error
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    BadRequestLimited:
      description: The request does not match the schema (`validation_error`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimitOptional'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingOptional'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitResetOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/validation_error
            title: Validation error
            status: 400
            detail: 'limit: must be at most 100'
            code: validation_error
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    Unauthorized:
      description: The API key is missing, malformed, expired or revoked, or the request signature is wrong (`unauthorized`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: The API key is missing, malformed, expired or revoked.
            code: unauthorized
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    UnauthorizedLimited:
      description: The API key is missing, malformed, expired or revoked, or the request signature is wrong (`unauthorized`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimitOptional'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingOptional'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitResetOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: The API key is missing, malformed, expired or revoked.
            code: unauthorized
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    Forbidden:
      description: >-
        The key lacks the scope (`forbidden_scope`), the caller's address is outside
        the key's allowlist (`ip_not_allowed`), or the tenant is suspended
        (`tenant_suspended`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden_scope:
              summary: The key lacks the scope
              value:
                type: https://docs.zakadi.dev/errors/forbidden_scope
                title: Forbidden scope
                status: 403
                detail: The API key lacks the scope this operation needs.
                code: forbidden_scope
                request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
            ip_not_allowed:
              summary: The address is outside the allowlist
              value:
                type: https://docs.zakadi.dev/errors/ip_not_allowed
                title: IP not allowed
                status: 403
                detail: The request comes from an address outside the key's allowlist.
                code: ip_not_allowed
                request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
            tenant_suspended:
