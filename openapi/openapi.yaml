    SessionNotCancellable:
      description: The session has already ended (`session_not_cancellable`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/session_not_cancellable
            title: Session not cancellable
            status: 409
            detail: The session has already ended.
            code: session_not_cancellable
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    WebhookLimit:
      description: The tenant already has 5 endpoints (`webhook_limit`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/webhook_limit
            title: Webhook limit reached
            status: 409
            detail: The tenant already has 5 webhook endpoints.
            code: webhook_limit
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    EvidenceExpired:
      description: The session's evidence was deleted at the end of its retention (`evidence_expired`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimitOptional'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingOptional'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitResetOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/evidence_expired
            title: Evidence expired
            status: 410
            detail: The evidence of this session was deleted at the end of its retention.
            code: evidence_expired
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    IdempotencyConflict:
      description: The `Idempotency-Key` was used with a different body in the last 24 h (`idempotency_conflict`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/idempotency_conflict
            title: Idempotency conflict
            status: 422
            detail: This Idempotency-Key was used with a different body in the last 24 h.
            code: idempotency_conflict
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    UnprocessableSession:
      description: >-
        The `Idempotency-Key` was used with a different body in the last 24 h
        (`idempotency_conflict`), or `policy.version` names no version of the tenant's
        policy (`policy_version_unknown`).
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimitOptional'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingOptional'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitResetOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotency_conflict:
              summary: The key was used with a different body
              value:
                type: https://docs.zakadi.dev/errors/idempotency_conflict
                title: Idempotency conflict
                status: 422
                detail: This Idempotency-Key was used with a different body in the last 24 h.
                code: idempotency_conflict
                request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
            policy_version_unknown:
              summary: The policy version does not exist
              value:
                type: https://docs.zakadi.dev/errors/policy_version_unknown
                title: Policy version unknown
                status: 422
                detail: Policy version 99 does not exist for this tenant.
                code: policy_version_unknown
                request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    TooManyRequests:
      description: The rate limit is exhausted (`rate_limited`); retry after `Retry-After` seconds.
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/rate_limited
            title: Rate limited
            status: 429
            detail: The key made 600 requests to createSession in the current minute.
            code: rate_limited
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    InternalError:
      description: An unexpected server error (`internal_error`); retry with backoff.
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/internal_error
            title: Internal error
            status: 500
            detail: An unexpected error occurred; retry with backoff.
            code: internal_error
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M
    InternalErrorLimited:
      description: An unexpected server error (`internal_error`); retry with backoff.
      headers:
        Zakadi-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimitOptional'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemainingOptional'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitResetOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.zakadi.dev/errors/internal_error
            title: Internal error
            status: 500
            detail: An unexpected error occurred; retry with backoff.
            code: internal_error
            request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M

  schemas:
    SessionId:
      type: string
      description: A session id, `ses_` and the session ULID (the protocol's `sessionId`).
      pattern: '^ses_[A-Za-z0-9]+$'
      examples: [ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H]
    EventId:
      type: string
      description: A webhook event id, `evt_` and a ULID.
      pattern: '^evt_[A-Za-z0-9]+$'
      examples: [evt_01J8ZQ6N2P4R6T8V0X2Z4B6D8F]
    JobId:
      type: string
      description: A job id, `job_` and a ULID.
      pattern: '^job_[A-Za-z0-9]+$'
      examples: [job_01J8ZQ9C2F6G4H7J8K9M0N1P2Q]
    Locale:
      type: string
      description: A BCP 47 language tag with a region, as the prompt packs are keyed.
      pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$'
      examples: [en-NG]
    Region:
      type: string
      description: A deployment region.
      pattern: '^[a-z]{2}-[a-z]+-[0-9]+$'
      examples: [af-south-1]
    SemVer:
      type: string
      description: A semantic version.
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      examples: [1.4.2]
    Channel:
      type: string
      description: The platform a session runs on.
      enum: [web, android, ios]
    Band:
      type: string
      description: The assurance band.
      enum: [A, B, C]
    SessionStatus:
      type: string
      description: A session's status.
      enum: [created, connected, in_progress, verifying, passed, failed, inconclusive, expired, aborted]
    Decision:
      type: string
      description: The verdict. RPs act on `decision` and `band`.
      enum: [pass, fail, inconclusive]
    ChallengeKind:
      type: string
      description: A challenge kind (the protocol's `challengeKind`).
      enum: [head_turn, distance, fingers, digits, blink, expression, hand_over_face, look_profile]
    ReasonCode:
      type: string
      description: >-
        A reason code of one of the families `ACTIONS_*`, `PAD_*`, `DIGITAL_*`,
        `NONCE_*`, `TIMING_*`, `AUDIO_*`, `CAMERA_*`, `NETWORK_*`, `DEVICE_*`,
        `DEDUPE_*`, `QUALITY_*` and `SESSION_*`; the list with severities is
        `docs/reason-codes.md`, versioned with the fusion configuration.
      pattern: '^(ACTIONS|PAD|DIGITAL|NONCE|TIMING|AUDIO|CAMERA|NETWORK|DEVICE|DEDUPE|QUALITY|SESSION)_[A-Z0-9_]+$'
      examples: [ACTIONS_OK]
    Metadata:
      type: object
      description: >-
        Opaque RP data, at most 2 KB, echoed in the session, the result and the
        webhook; an empty object when none was given.
      examples:
        - flow: onboarding
          attempt: 1
    ErrorCode:
      type: string
      description: A problem `code` (2.9).
      enum:
        - unauthorized
        - forbidden_scope
        - ip_not_allowed
        - rate_limited
        - validation_error
        - idempotency_conflict
        - tenant_suspended
        - policy_version_unknown
        - session_not_found
        - webhook_not_found
        - job_not_found
        - session_not_cancellable
        - result_pending
        - evidence_expired
        - webhook_limit
        - internal_error
    Problem:
      type: object
      description: >-
        An RFC 9457 problem, served as `application/problem+json`. `type` is
        `https://docs.zakadi.dev/errors/` and the `code`.
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type.
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: This occurrence of the problem, for a person to read.
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
          description: The request's `Zakadi-Request-Id`.
      examples:
        - type: https://docs.zakadi.dev/errors/session_not_found
          title: Session not found
          status: 404
          detail: No session ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H belongs to this tenant.
          code: session_not_found
          request_id: req_01J8ZQ5B7C9D1E3F5G7H9J1K3M

    SessionCreate:
      type: object
      description: The body of `createSession`.
      required: [user_ref, locale, channel]
      properties:
        user_ref:
          type: string
          minLength: 1
          description: >-
            The RP's reference for the end user; stored hashed, and the key of the
            per-user limits and of `purgeSubject`.
        locale:
          $ref: '#/components/schemas/Locale'
        channel:
          $ref: '#/components/schemas/Channel'
        device_correlation_id:
          type: string
          minLength: 1
          description: Optional opaque device reference the RP defines; stored hashed.
        policy:
          $ref: '#/components/schemas/SessionPolicy'
        ingest_hint:
          $ref: '#/components/schemas/IngestHint'
        callback:
          $ref: '#/components/schemas/Callback'
        metadata:
          $ref: '#/components/schemas/Metadata'
        evidence:
          $ref: '#/components/schemas/EvidenceRequest'
    SessionPolicy:
      type: object
      description: >-
        The tenant policy version the session pins, the current one when absent, and
        per-session overrides.
      properties:
        version:
          type: integer
          minimum: 1
          description: A version of the tenant's policy.
        overrides:
          type: object
          description: Per-session overrides of the pinned policy.
          properties:
            min_actions:
              type: integer
              minimum: 1
              description: The fewest actions the session asks for.
            languages:
              type: array
              description: The languages the end user may choose from.
              minItems: 1
              items:
                $ref: '#/components/schemas/Locale'
      examples:
        - version: 12
          overrides:
            min_actions: 2
            languages: [en-NG, fr-CI]
    IngestHint:
      type: object
      description: Where the end user is, to order the ingest regions.
      properties:
        country:
          type: string
          description: An ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'
      examples:
        - country: NG
    Callback:
      type: object
      description: A per-session webhook endpoint and the reference of the secret that signs its deliveries.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The endpoint.
        secret_ref:
          type: string
          minLength: 1
          description: The `secret_ref` of a registered secret.
      examples:
        - url: https://rp.example/liveness/hook
          secret_ref: wh_sec_01
    EvidenceRequest:
      type: object
      description: >-
        What evidence the session keeps. `clip` needs the tenant policy's
        `evidence_clip_allowed`, and `retention_days` is capped by its
        `evidence_days_max`.
      properties:
        audit_frames:
          type: boolean
          description: Keep audit frames.
        clip:
          type: boolean
          description: Keep a clip.
        retention_days:
          type: integer
          minimum: 1
          description: Days the evidence is kept.
      examples:
        - audit_frames: true
          clip: false
          retention_days: 7

    SessionCreated:
      type: object
      description: >-
        The `createSession` response. `client_token`, `ingest`, `prompt_pack` and `ui`
        go to the SDK unchanged, and the token is never logged.
      required: [session_id, client_token, expires_at, ingest, prompt_pack, ui, policy_version, status]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        client_token:
          type: string
          description: >-
            An ES256 JWT for the ingest edge, valid for 300 s and usable once, with the
            claims `iss`, `aud` (`ingest`), `sub` (the session id), `tid`, `jti`,
            `iat`, `nbf`, `exp`, `pol`, `band_max`, `ing`, `nonce` and `lang`.
        expires_at:
          type: string
          format: date-time
          description: When `client_token` expires.
        ingest:
          type: array
          description: The ingest endpoints the SDK may connect to, in order.
          minItems: 1
          items:
            $ref: '#/components/schemas/IngestCandidate'
        prompt_pack:
          $ref: '#/components/schemas/PackRef'
        ui:
          $ref: '#/components/schemas/SessionUi'
        policy_version:
          type: integer
          minimum: 1
          description: The policy version the session pinned.
        status:
          $ref: '#/components/schemas/SessionStatus'
    IngestCandidate:
      type: object
      description: An ingest endpoint for the session.
      required: [region, url]
      properties:
        region:
          $ref: '#/components/schemas/Region'
        url:
          type: string
          format: uri
          description: The session's WebSocket URL in that region.
      examples:
        - region: af-south-1
          url: wss://ingest-afs1.zakadi.dev/v1/sessions/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/stream
    PackRef:
      type: object
      description: A prompt pack.
      required: [lang, version, url]
      properties:
        lang:
          $ref: '#/components/schemas/Locale'
        version:
          type: string
          minLength: 1
          description: The pack version.
        url:
          type: string
          format: uri
          description: The pack's manifest.
      examples:
        - lang: en-NG
          version: '2026.09.1'
          url: https://cdn.zakadi.dev/packs/en-NG/2026.09.1/manifest.json
    SessionUi:
      type: object
      description: >-
        What the SDK shows (D11): the tenant's consent copy per language, brand tokens,
        badge text and the alternate packs the user may switch to. Passed to the SDK
        unchanged as `sessionUi`.
      required: [consent_copy, brand, badge_text, packs]
      properties:
        consent_copy:
          type: object
          description: Consent copy keyed by language tag.
          additionalProperties:
            $ref: '#/components/schemas/ConsentCopy'
        brand:
          $ref: '#/components/schemas/Brand'
        badge_text:
          type: [string, 'null']
          description: Text of the badge, or null for none.
        packs:
          type: array
          description: The packs the user may switch to.
          items:
            $ref: '#/components/schemas/PackRef'
      examples:
        - consent_copy:
            en-NG:
              title: A short video check
              body: We will ask you to follow two short prompts on camera to confirm that you are present.
              recording_notice: Two still frames from this call are kept for 7 days for audit.
          brand:
            primary: '#0A5'
            logo_url: null
          badge_text: null
          packs:
            - lang: en-NG
              version: '2026.09.1'
              url: https://cdn.zakadi.dev/packs/en-NG/2026.09.1/manifest.json
    ConsentCopy:
      type: object
      description: Consent copy in one language.
      required: [title, body, recording_notice]
      properties:
        title:
          type: string
          description: The consent screen's title.
        body:
          type: string
          description: The consent text.
        recording_notice:
          type: string
          description: What is recorded and kept.
      examples:
        - title: A short video check
          body: We will ask you to follow two short prompts on camera to confirm that you are present.
          recording_notice: Two still frames from this call are kept for 7 days for audit.
    Brand:
      type: object
      description: Brand tokens.
      required: [primary, logo_url]
      properties:
        primary:
          type: string
          description: The primary colour, as a hex RGB colour.
          pattern: '^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$'
        logo_url:
          type: [string, 'null']
          format: uri
          description: The logo, or null for none.
      examples:
        - primary: '#0A5'
          logo_url: null

    Session:
      type: object
      description: A session's status and timestamps (`getSession`).
      required: [session_id, status, created_at, connected_at, ended_at, verdict_at, policy_version, channel, ingest_region, band, metadata]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        status:
          $ref: '#/components/schemas/SessionStatus'
        created_at:
          type: string
          format: date-time
          description: When the session was created.
        connected_at:
          type: [string, 'null']
          format: date-time
          description: When the SDK connected, or null before it did.
        ended_at:
          type: [string, 'null']
          format: date-time
          description: When the session ended, or null before it did.
        verdict_at:
          type: [string, 'null']
          format: date-time
          description: When the verdict was written, or null before it was.
        policy_version:
          type: integer
          minimum: 1
          description: The policy version the session pinned.
        channel:
          $ref: '#/components/schemas/Channel'
        ingest_region:
          type: [string, 'null']
          description: The ingest region the SDK connected to, or null before it connected.
          pattern: '^[a-z]{2}-[a-z]+-[0-9]+$'
        band:
          type: [string, 'null']
          description: The assurance band, or null until it is known.
          enum: [A, B, C, null]
        metadata:
          $ref: '#/components/schemas/Metadata'
    SessionPage:
      type: object
      description: One page of sessions, newest first.
      required: [data, next_cursor]
      properties:
        data:
          type: array
          description: The sessions.
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: [string, 'null']
          description: The `cursor` of the next page, or null on the last page.

    ResultData:
      type: object
      description: >-
        A session's verdict without its token: the `data` of a webhook delivery, and
        with `result_token` the `getResult` response. `band`, `confidence`, `quality`
        and `device` are null for a session that ended before any media arrived.
      required: [session_id, decision, band, confidence, reason_codes, reasons_detail, challenges, quality, device, models, policy_version, verdict_at, evidence, metadata]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        decision:
          $ref: '#/components/schemas/Decision'
        band:
          type: [string, 'null']
          description: The assurance band.
          enum: [A, B, C, null]
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: >-
            The fusion model's calibrated probability that the session is live and
            unmanipulated, for analytics.
        reason_codes:
          type: array
          description: The reason codes behind the decision.
          items:
            $ref: '#/components/schemas/ReasonCode'
        reasons_detail:
          type: array
          description: Reason codes with their severity and a note.
          items:
            $ref: '#/components/schemas/ReasonDetail'
        challenges:
          type: array
          description: The challenges issued, in order.
          items:
            $ref: '#/components/schemas/ChallengeResult'
        quality:
          $ref: '#/components/schemas/Quality'
        device:
          $ref: '#/components/schemas/Device'
        models:
          $ref: '#/components/schemas/Models'
        policy_version:
          type: integer
          minimum: 1
          description: The policy version the session pinned.
        verdict_at:
          type: string
          format: date-time
          description: When the verdict was written.
        evidence:
          $ref: '#/components/schemas/ResultEvidence'
        metadata:
          $ref: '#/components/schemas/Metadata'
        superseded:
          type: boolean
          description: True on a verdict that replaced one written after a verdict timeout.
    Result:
      type: object
      description: The `getResult` response, the verdict with its `result_token`.
      allOf:
        - $ref: '#/components/schemas/ResultData'
        - type: object
          required: [result_token]
          properties:
            result_token:
              type: string
              description: >-
                An ES256 JWS, verified against `/.well-known/jwks.json`, over `iss`,
                `aud` (the tenant id), `sub` (the session id), `jti`, `iat`, `exp` (`iat`
                + 3600), `decision`, `band`, `confidence`, `reason_codes`,
                `user_ref_hash`, `policy_version` and `models_hash`.
    ReasonDetail:
      type: object
      description: A reason code with its severity and a note.
      required: [code, severity, text]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        severity:
          type: string
          description: The code's severity in `docs/reason-codes.md`.
        text:
          type: string
          description: A note for a person to read.
      examples:
        - code: NONCE_WEAK
          severity: info
          text: illumination response weak; outdoor session
    ChallengeResult:
      type: object
      description: One challenge and its outcome.
      required: [id, kind, result, attempts, latency_ms]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 32
          description: The challenge id of the protocol's `action`.
        kind:
          $ref: '#/components/schemas/ChallengeKind'
        result:
          type: string
          description: The outcome.
        attempts:
          type: integer
          minimum: 1
          description: Attempts made.
        latency_ms:
          type: integer
          minimum: 0
          description: Response latency in milliseconds.
      examples:
        - id: a1
          kind: head_turn
          result: pass
          attempts: 1
          latency_ms: 640
    Quality:
      type: [object, 'null']
      description: Capture and network quality, or null when no media arrived.
      required: [lighting, face_size, network_rung_median, received_fps_median]
      properties:
        lighting:
          type: string
          description: The lighting.
          enum: [low, ok, bright]
        face_size:
          type: string
          description: The face size.
        network_rung_median:
          type: integer
          minimum: 0
          maximum: 15
          description: The median ladder rung.
        received_fps_median:
          type: number
          minimum: 0
          description: The median received frame rate.
      examples:
        - lighting: ok
          face_size: ok
          network_rung_median: 2
          received_fps_median: 14.6
    Device:
      type: [object, 'null']
      description: The device and its attestation, or null when no media arrived.
      required: [platform, attested, attestation_verdict]
      properties:
        platform:
          $ref: '#/components/schemas/Channel'
        attested:
          type: boolean
          description: Whether a platform attestation verified.
        attestation_verdict:
          type: [string, 'null']
          description: The platform's attestation verdict, or null without one.
      examples:
        - platform: android
          attested: true
          attestation_verdict: MEETS_DEVICE_INTEGRITY
    Models:
      type: object
      description: >-
        The model versions behind the verdict by role (`pad_trunk`, `digital_head`,
        `fusion`, `landmarks`); empty when no model ran.
      additionalProperties:
        type: string
      examples:
        - pad_trunk: dinov2b-reg-pad@1.3.0+d41d8
          digital_head: digital-head@1.1.0+9e107
          fusion: fusion@0.9.2
          landmarks: mediapipe-face-0.10.31
    ResultEvidence:
      type: object
      description: What evidence the session kept, and until when.
      required: [audit_frames, clip, expires_at]
      properties:
        audit_frames:
          type: integer
          minimum: 0
          description: Audit frames kept.
        clip:
          type: boolean
          description: Whether a clip was kept.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the evidence is deleted, or null when nothing was kept.
      examples:
        - audit_frames: 2
          clip: false
          expires_at: '2026-09-29T10:01:12Z'

    SessionEvidence:
      type: object
      description: >-
        The `getEvidence` response, from the `result_scores`, `challenges` and
        `evidence` tables (03 3.8): sub-scores, forensic scalars, timing
        distributions, per-challenge scores and signed URLs.
      required: [session_id, scores, forensics, timing, challenges, audit_frames, clip, expires_at]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        scores:
          type: object
          description: Calibrated sub-scores by name.
          additionalProperties:
            type: number
        forensics:
          type: object
          description: Forensic scalars by name.
          additionalProperties:
            type: number
        timing:
          type: object
          description: Timing distributions and clock statistics by name.
        challenges:
          type: array
          description: The challenges issued, in order, with their scores.
          items:
            $ref: '#/components/schemas/EvidenceChallenge'
        audit_frames:
          type: array
          description: Signed URLs of the audit frames.
          items:
            $ref: '#/components/schemas/SignedUrl'
        clip:
          description: A signed URL of the clip, or null when none was kept.
          anyOf:
            - $ref: '#/components/schemas/SignedUrl'
            - type: 'null'
        expires_at:
          type: string
          format: date-time
          description: When the evidence is deleted.
    EvidenceChallenge:
      type: object
      description: One challenge with its parameters, outcome and scores.
      required: [idx, id, kind, params, result, attempts, latency_ms, scores]
      properties:
        idx:
          type: integer
          minimum: 0
          description: The challenge's position in the session.
        id:
          type: string
          minLength: 1
          maxLength: 32
          description: The challenge id of the protocol's `action`.
        kind:
          $ref: '#/components/schemas/ChallengeKind'
        params:
          type: object
          description: The parameters the server chose (the protocol's `action.params`).
        result:
          type: string
          description: The outcome.
        attempts:
          type: integer
          minimum: 1
          description: Attempts made.
        latency_ms:
          type: integer
          minimum: 0
          description: Response latency in milliseconds.
        scores:
          type: object
          description: This challenge's scores by name.
          additionalProperties:
            type: number
      examples:
        - idx: 0
          id: a1
          kind: head_turn
          params:
            direction: user_left
            min_deg: 20
            hold_ms: 200
          result: pass
          attempts: 1
          latency_ms: 640
          scores:
            geometry: 0.98
    SignedUrl:
      type: object
      description: A short-lived signed URL, valid for 15 minutes.
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: The URL.
        expires_at:
          type: string
          format: date-time
          description: When the URL stops working.
      examples:
        - url: https://objects-afs1.zakadi.dev/evidence/ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H/frame-1?expires=1790073000&signature=7d1c0e5a9b3f
          expires_at: '2026-09-22T10:30:00Z'

    SubjectPurge:
      type: object
      description: The body of `purgeSubject`.
      required: [user_ref]
      properties:
        user_ref:
          type: string
          minLength: 1
          description: The end user whose data is purged across sessions.
      examples:
        - user_ref: cust-88213
    Job:
      type: object
      description: A background job; `purgeSubject` starts one.
      required: [job_id, kind, status, created_at, completed_at]
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        kind:
          type: string
          description: What the job does.
          enum: [subject_purge]
        status:
          type: string
          description: The job's state.
          enum: [pending, running, succeeded, failed]
        created_at:
          type: string
          format: date-time
          description: When the job was accepted.
        completed_at:
          type: [string, 'null']
          format: date-time
          description: When the job finished, or null while it runs.

    WebhookEventType:
      type: string
      description: A webhook event type.
      enum: [zakadi.session.completed, zakadi.session.aborted, zakadi.session.expired]
    WebhookCreate:
      type: object
      description: The body of `createWebhook`.
      required: [url, events, secret]
      properties:
        url:
          type: string
          format: uri
          description: The endpoint.
        events:
          type: array
          description: The events delivered to it.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        secret:
          type: string
          minLength: 32
          description: The signing secret, at least 32 bytes; never returned.
        active:
          type: boolean
          default: true
          description: Whether deliveries are made.
      examples:
        - url: https://rp.example/liveness/hook
          events: [zakadi.session.completed]
          secret: 5scJWszxU8haiavas08P_6vYYYT1bt472Ucz0kWD
          active: true
    WebhookUpdate:
      type: object
      description: The body of `updateWebhook`.
      required: [url, events, active]
      properties:
        url:
          type: string
          format: uri
          description: The endpoint.
        events:
          type: array
          description: The events delivered to it.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        active:
          type: boolean
          description: Whether deliveries are made.
        secret:
          type: string
          minLength: 32
          description: A new signing secret, at least 32 bytes; the current one is kept when absent.
      examples:
        - url: https://rp.example/liveness/hook
          events: [zakadi.session.completed]
          active: true
    Webhook:
      type: object
      description: A webhook endpoint (the `webhooks` table of 03 3.8), without its secret.
      required: [webhook_id, url, events, secret_ref, active, created_at]
      properties:
        webhook_id:
          type: string
          format: uuid
          description: The endpoint's id.
        url:
          type: string
          format: uri
          description: The endpoint.
        events:
          type: array
          description: The events delivered to it.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        secret_ref:
          type: string
          description: The reference of the signing secret, which a session's `callback.secret_ref` may name.
        active:
          type: boolean
          description: Whether deliveries are made.
        created_at:
          type: string
          format: date-time
          description: When the endpoint was created.
    WebhookList:
      type: object
      description: The tenant's endpoints.
      required: [data]
      properties:
        data:
          type: array
          description: The endpoints, at most 5.
          maxItems: 5
          items:
            $ref: '#/components/schemas/Webhook'
    WebhookDelivery:
      type: object
      description: One delivery attempt (the `webhook_attempts` table of 03 3.8).
      required: [webhook_id, event_id, attempt, status, error, at]
      properties:
        webhook_id:
          type: string
          format: uuid
          description: The endpoint.
        event_id:
          $ref: '#/components/schemas/EventId'
        attempt:
          type: integer
          minimum: 1
          description: The attempt number, 1 for the first delivery.
        status:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
          description: The receiver's HTTP status, or null when it did not answer.
        error:
          type: [string, 'null']
          description: Why the attempt failed, or null when it succeeded.
        at:
          type: string
          format: date-time
          description: When the attempt was made.
    WebhookDeliveryPage:
      type: object
      description: One page of delivery attempts, newest first.
      required: [data, next_cursor]
      properties:
        data:
          type: array
          description: The attempts.
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type: [string, 'null']
          description: The `cursor` of the next page, or null on the last page.
    WebhookEvent:
      type: object
      description: >-
        A webhook delivery body. `data` is the result without `result_token`, which
        travels beside it; events are idempotent by `id`.
      required: [id, type, created_at, data, result_token]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        created_at:
          type: string
          format: date-time
          description: When the event was created.
        data:
          $ref: '#/components/schemas/ResultData'
        result_token:
          type: string
          description: The result's ES256 JWS, as in `getResult`.

    PolicySettings:
      type: object
      description: >-
        The body of `updatePolicy`: every setting of the tenant policy (2.5).
        `thresholds.profile` names an operating point of the fusion model; tenants
        cannot set raw thresholds.
      required: [actions, assurance, thresholds, attempts, step_up, languages, retention, dedupe, residency, ui]
      properties:
        actions:
          $ref: '#/components/schemas/PolicyActions'
        assurance:
          $ref: '#/components/schemas/PolicyAssurance'
        thresholds:
          $ref: '#/components/schemas/PolicyThresholds'
        attempts:
          $ref: '#/components/schemas/PolicyAttempts'
        step_up:
          $ref: '#/components/schemas/PolicyStepUp'
        languages:
          type: array
          description: The languages sessions may use.
          minItems: 1
          items:
            $ref: '#/components/schemas/Locale'
        retention:
          $ref: '#/components/schemas/PolicyRetention'
        dedupe:
          $ref: '#/components/schemas/PolicyDedupe'
        attestation:
          $ref: '#/components/schemas/PolicyAttestation'
        residency:
          $ref: '#/components/schemas/PolicyResidency'
        ui:
          $ref: '#/components/schemas/PolicyUi'
    Policy:
      type: object
      description: The tenant policy (`getPolicy`, `updatePolicy`) with its immutable `version`.
      allOf:
        - $ref: '#/components/schemas/PolicySettings'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1
              description: The version; every `updatePolicy` creates the next one.
    PolicyActions:
      type: object
      description: How many actions a session asks for, and from which pools.
      required: [min, max, pool, step_up_pool, require_geometry, require_high_entropy]
      properties:
        min:
          type: integer
          minimum: 1
          description: The fewest actions.
        max:
          type: integer
          minimum: 1
          description: The most actions.
        pool:
          type: array
          description: The kinds actions are drawn from.
          minItems: 1
          items:
            $ref: '#/components/schemas/ChallengeKind'
        step_up_pool:
          type: array
          description: The kinds a step-up draws from.
          items:
            $ref: '#/components/schemas/ChallengeKind'
        require_geometry:
          type: boolean
          description: Require an action that checks geometry.
        require_high_entropy:
          type: boolean
          description: Require a high-entropy action.
      examples:
        - min: 2
          max: 3
          pool: [head_turn, distance, fingers, digits, blink, expression]
          step_up_pool: [hand_over_face, look_profile]
          require_geometry: true
          require_high_entropy: true
    PolicyAssurance:
      type: object
      description: Which bands and channels the tenant accepts.
      required: [accept_bands, web_allowed, attestation_required]
      properties:
        accept_bands:
          type: array
          description: The bands accepted.
          minItems: 1
          items:
            $ref: '#/components/schemas/Band'
        web_allowed:
          type: boolean
          description: Whether web sessions are allowed.
        attestation_required:
          type: boolean
          description: Whether a platform attestation is required.
      examples:
        - accept_bands: [A, B]
          web_allowed: true
          attestation_required: false
    PolicyThresholds:
      type: object
      description: The named operating point of the fusion model.
      required: [profile]
      properties:
        profile:
          type: string
          description: The profile; each is published with its measured BPCER and APCER per release.
          enum: [balanced, strict, lenient]
      examples:
        - profile: balanced
    PolicyAttempts:
      type: object
      description: Attempt and velocity limits.
      required: [per_action, restarts, sessions_per_user_ref_per_day, sessions_per_face_per_day]
      properties:
        per_action:
          type: integer
          minimum: 1
          description: Attempts per action.
        restarts:
          type: integer
          minimum: 0
          description: Restarts per session.
        sessions_per_user_ref_per_day:
          type: integer
          minimum: 1
          description: Sessions per `user_ref` per day.
        sessions_per_face_per_day:
          type: integer
          minimum: 1
          description: Sessions per face per day.
      examples:
        - per_action: 3
          restarts: 2
          sessions_per_user_ref_per_day: 10
          sessions_per_face_per_day: 10
    PolicyStepUp:
      type: object
      description: Step-up challenges and the human handoff.
      required: [enabled, human_handoff, handoff_url]
      properties:
        enabled:
          type: boolean
          description: Whether step-up challenges are used.
        human_handoff:
          type: boolean
          description: Whether sessions may be handed to a person.
        handoff_url:
          type: [string, 'null']
          format: uri
          description: Where the handoff goes, or null for none.
      examples:
        - enabled: true
          human_handoff: false
          handoff_url: null
    PolicyRetention:
      type: object
      description: Retention periods in days.
      required: [results_days, evidence_days_default, evidence_days_max, evidence_clip_allowed, embeddings_days]
      properties:
        results_days:
          type: integer
          minimum: 1
          description: Days results are kept.
        evidence_days_default:
          type: integer
          minimum: 0
          description: Days evidence is kept when a session does not say.
        evidence_days_max:
          type: integer
          minimum: 0
          description: The most days a session may keep evidence.
        evidence_clip_allowed:
          type: boolean
          description: Whether sessions may keep a clip.
        embeddings_days:
          type: integer
          minimum: 0
          description: Days face embeddings are kept.
      examples:
        - results_days: 365
          evidence_days_default: 7
          evidence_days_max: 30
          evidence_clip_allowed: false
          embeddings_days: 30
    PolicyDedupe:
      type: object
      description: Duplicate detection.
      required: [enabled, cross_session_face_match]
      properties:
        enabled:
          type: boolean
          description: Whether duplicates are detected.
        cross_session_face_match:
          type: boolean
          description: Whether faces are matched across sessions.
      examples:
        - enabled: true
          cross_session_face_match: true
    PolicyAttestation:
      type: object
      description: >-
        What the verdict worker needs to verify platform tokens. Without it,
        attestation tokens are ignored and the session's band is at most `B`.
      properties:
        play_integrity:
          type: object
          description: >-
            Play Integrity: the host app's Google Cloud project number, and either
            `google_api` with a service-account credential the tenant grants or `local`
            with the keys the tenant exported from Play Console.
          required: [cloud_project_number, verify, credentials_ref]
          properties:
            cloud_project_number:
              type: string
              description: The Google Cloud project number.
              pattern: '^[0-9]+$'
            verify:
              type: string
              description: How tokens are verified.
              enum: [google_api, local]
            credentials_ref:
              type: string
              description: The reference of the credential or keys.
        app_attest:
          type: object
          description: App Attest.
          required: [team_id, bundle_id]
          properties:
            team_id:
              type: string
              description: The Apple team ID.
            bundle_id:
              type: string
              description: The app's bundle ID.
      examples:
        - play_integrity:
            cloud_project_number: '1234567890'
            verify: google_api
            credentials_ref: sec_pi_01
          app_attest:
            team_id: ABCDE12345
            bundle_id: com.rp.app
    PolicyResidency:
      type: object
      description: Where sessions are ingested and scored.
      required: [ingest_regions, gpu_regions, in_country_only]
      properties:
        ingest_regions:
          type: array
          description: The ingest regions allowed.
          minItems: 1
          items:
            $ref: '#/components/schemas/Region'
        gpu_regions:
          type: array
          description: The regions models may run in.
          items:
            $ref: '#/components/schemas/Region'
        in_country_only:
          type: boolean
          description: Whether data stays in the end user's country.
      examples:
        - ingest_regions: [eu-west-2, af-south-1]
          gpu_regions: [af-south-1]
          in_country_only: false
    PolicyUi:
      type: object
      description: The tenant's UI settings.
      required: [character, brand, badge_text]
      properties:
        character:
          type: string
          description: The on-screen character, or none.
          enum: [default, none]
        brand:
          $ref: '#/components/schemas/Brand'
        badge_text:
          type: [string, 'null']
          description: Text of the badge, or null for none.
      examples:
        - character: default
          brand:
            primary: '#0A5'
            logo_url: null
          badge_text: null

    Usage:
      type: object
      description: Session counts per UTC day (the `usage_daily` table of 03 3.8).
      required: [from, to, data]
      properties:
        from:
          type: string
          format: date
          description: The first day counted.
        to:
          type: string
          format: date
          description: The last day counted.
        data:
          type: array
          description: One row per day, channel, band and status with sessions.
          items:
            $ref: '#/components/schemas/UsageRow'
    UsageRow:
      type: object
      description: Sessions of one day, channel, band and status.
      required: [day, channel, band, status, count]
      properties:
        day:
          type: string
          format: date
          description: The UTC day.
        channel:
          $ref: '#/components/schemas/Channel'
        band:
          type: [string, 'null']
          description: The band, or null for sessions that ended without one.
          enum: [A, B, C, null]
        status:
          $ref: '#/components/schemas/SessionStatus'
        count:
          type: integer
          format: int64
          minimum: 0
          description: Sessions.
      examples:
        - day: '2026-09-21'
          channel: android
          band: A
          status: passed
          count: 1204

    SdkConfig:
      type: object
      description: The `getSdkConfig` response (2.6, D10, D38).
      required: [min_version, latest_version, kill_switch, wrapper_min_version, message, protocol, prompt_pack_cdn, probe, ladder_version, device_quirks]
      properties:
        min_version:
          $ref: '#/components/schemas/SemVer'
        latest_version:
          $ref: '#/components/schemas/SemVer'
        kill_switch:
          type: boolean
          description: When true the SDK refuses to start and shows `message`.
        wrapper_min_version:
          type: object
          description: The lowest wrapper version the SDK starts under, by wrapper package.
          additionalProperties:
            $ref: '#/components/schemas/SemVer'
        message:
          type: [string, 'null']
          description: What the SDK shows when it refuses to start, or null.
        protocol:
          type: array
          description: The protocol versions the ingest serves.
          minItems: 1
          items:
            type: string
            pattern: '^zakadi\.v[0-9]+$'
        prompt_pack_cdn:
          type: string
          format: uri
          description: The prompt-pack CDN base URL.
        probe:
          type: object
          description: The in-band probe the SDK sends.
          required: [count, bytes]
          properties:
            count:
              type: integer
              minimum: 1
              description: Probe messages.
            bytes:
              type: integer
              minimum: 1
              description: Bytes per probe message.
        ladder_version:
          type: integer
          minimum: 1
          description: The version of the rung ladder.
        device_quirks:
          type: array
          description: Per-device capability caps.
          items:
            $ref: '#/components/schemas/DeviceQuirk'
    DeviceQuirk:
      type: object
      description: Caps for the devices `match` selects.
      required: [match, caps]
      properties:
        match:
          $ref: '#/components/schemas/QuirkMatch'
        caps:
          $ref: '#/components/schemas/QuirkCaps'
      examples:
        - match:
            platform: android
            model_prefix: TECNO KI5
          caps:
            max_fps: 12
            prefer_software_encoder: false
    QuirkMatch:
      type: object
      description: Every key present must match.
      minProperties: 1
      properties:
        platform:
          $ref: '#/components/schemas/Channel'
        model_prefix:
          type: string
          description: A prefix of the device model; on web, from User-Agent Client Hints where available.
        browser:
          type: string
          description: The browser.
        browser_major_min:
          type: integer
          minimum: 0
          description: The lowest browser major version.
        browser_major_max:
          type: integer
          minimum: 0
          description: The highest browser major version.
        os_major_min:
          type: integer
          minimum: 0
          description: The lowest OS major version.
        os_major_max:
          type: integer
          minimum: 0
          description: The highest OS major version.
      examples:
        - platform: web
          browser: Chrome
          browser_major_max: 110
    QuirkCaps:
      type: object
      description: The caps applied to a matching device.
      minProperties: 1
      properties:
        max_fps:
          type: integer
          minimum: 1
          description: The highest frame rate.
        max_rung:
          type: integer
          minimum: 0
          maximum: 15
          description: The best rung allowed.
        profile:
          type: string
          description: Forces the `mediarecorder` profile.
          enum: [mediarecorder]
        prefer_software_encoder:
          type: boolean
          description: Prefer the software H.264 encoder.
      examples:
        - profile: mediarecorder

    TelemetryBatch:
      type: object
      description: >-
        The body of `sendTelemetry`: at most 100 events and 32 KB, with no media,
        tokens, landmarks or user identifiers.
      required: [session_id, sdk, events]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        sdk:
          $ref: '#/components/schemas/SdkIdentity'
        events:
          type: array
          description: The events, oldest first.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
      examples:
        - session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
          sdk:
            platform: android
            name: dev.zakadi.sdk
            version: 1.4.2
          events:
            - name: sdk_start
              t_ms: 0
    SdkIdentity:
      type: object
      description: The SDK sending the events, as `hello.sdk` of the protocol reports it.
      required: [platform, name, version]
      properties:
        platform:
          $ref: '#/components/schemas/Channel'
        name:
          type: string
          description: The SDK package.
        version:
          type: string
          description: The SDK version.
        os:
          type: string
          description: The operating system.
        device:
          type: string
          description: The device model.
        browser:
          type: string
          description: The browser, on web only.
        wrapper:
          type: object
          description: The wrapper package embedding the SDK.
          required: [name, version]
          properties:
            name:
              type: string
              description: The wrapper package.
            version:
              type: string
              description: The wrapper version.
      examples:
        - platform: android
          name: dev.zakadi.sdk
          version: 1.4.2
          os: Android 13
          device: TECNO KI5
    TelemetryEvent:
      type: object
      description: One telemetry event.
      required: [name, t_ms]
      properties:
        name:
          type: string
          description: The event name.
          pattern: '^[a-z][a-z0-9_]*$'
        t_ms:
          type: integer
          minimum: 0
          description: Milliseconds since `sdk_start` on the SDK's monotonic clock.
        fields:
          type: object
          description: The event's fields.
      examples:
        - name: probe
          t_ms: 3920
          fields:
            goodput_kbps: 820
            rtt_ms: 190
            start_rung: 2

    Health:
      type: object
      description: Control plane liveness.
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` when the control plane answers.
          enum: [ok]
    IngestHealth:
      type: object
      description: Ingest health per region.
      required: [regions]
      properties:
        regions:
          type: array
          description: One entry per ingest region.
          items:
            $ref: '#/components/schemas/RegionHealth'
    RegionHealth:
      type: object
      description: One ingest region's health and admission headroom.
      required: [region, healthy, headroom]
      properties:
        region:
          $ref: '#/components/schemas/Region'
        healthy:
          type: boolean
          description: Whether an edge in the region admits sessions.
        headroom:
          type: number
          minimum: 0
          maximum: 1
          description: The free fraction of the region's admission capacity.
      examples:
        - region: af-south-1
          healthy: true
          headroom: 0.42

    Jwks:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      required: [keys]
      properties:
        keys:
          type: array
          description: The current key and, for 30 days after a rotation, the previous one.
          minItems: 1
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      description: An ES256 public key.
      required: [kty, crv, kid, use, alg, x, y]
      properties:
        kty:
          type: string
          description: The key type.
          enum: [EC]
        crv:
          type: string
          description: The curve.
          enum: [P-256]
        kid:
          type: string
          minLength: 1
          description: The key id tokens name in their header.
        use:
          type: string
          description: The key use.
          enum: [sig]
        alg:
          type: string
          description: The algorithm.
          enum: [ES256]
        x:
          type: string
          description: The x coordinate, base64url.
          pattern: '^[A-Za-z0-9_-]{43}$'
        y:
          type: string
          description: The y coordinate, base64url.
          pattern: '^[A-Za-z0-9_-]{43}$'
      examples:
        - kty: EC
          crv: P-256
          kid: cp-2026-09
          use: sig
          alg: ES256
          x: x8aW7uvxnW7tgIIzZ91pu4Gae-kF8ugUK9iDhwx7boM
          y: YZK8ihiWvX536ipCq13f2156N6vjfxer5s2_2iN6uiY
