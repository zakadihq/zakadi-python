  /v1/sdk/config:
    get:
      operationId: getSdkConfig
      tags: [SDK]
      summary: Get the SDK configuration
      description: >-
        Public, no key; cached 5 minutes. The SDK calls it at `start()`, refuses to
        start below `min_version` or when `kill_switch` is true, and fails open after
        2 s (D10). `device_quirks` entries match when every key present matches, and
        their `caps` cap the capture and encoder configuration (D38). Responds with
        `Access-Control-Allow-Origin: *` and no credentials (D35).
      security: []
      parameters:
        - name: platform
          in: query
          required: true
          description: The SDK's platform.
          schema:
            $ref: '#/components/schemas/Channel'
          example: android
        - name: version
          in: query
          required: true
          description: The SDK's version.
          schema:
            $ref: '#/components/schemas/SemVer'
          example: 1.4.2
        - name: wrapper
          in: query
          required: false
          description: The wrapper package and its version, `<name>@<version>`, when a wrapper embeds the SDK.
          schema:
            type: string
            pattern: '^.+@[0-9]+\.[0-9]+\.[0-9]+'
          example: zakadi_sdk@1.0.0
      responses:
        '200':
          description: The configuration for this platform, version and wrapper.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: Cached for 5 minutes.
              required: true
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdkConfig'
              example:
                min_version: 1.2.0
                latest_version: 1.4.2
                kill_switch: false
                wrapper_min_version:
                  '@zakadi/react': 1.0.0
                  '@zakadi/angular': 1.0.0
                  zakadi_sdk: 1.0.0
                  '@zakadi/react-native': 1.0.0
                message: null
                protocol: [zakadi.v1]
                prompt_pack_cdn: https://cdn.zakadi.dev/packs/
                probe:
                  count: 8
                  bytes: 8192
                ladder_version: 3
                device_quirks:
                  - match:
                      platform: android
                      model_prefix: TECNO KI5
                    caps:
                      max_fps: 12
                      prefer_software_encoder: false
                  - match:
                      platform: web
                      browser: Chrome
                      browser_major_max: 110
                    caps:
                      profile: mediarecorder
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/telemetry:
    post:
      operationId: sendTelemetry
      tags: [SDK]
      summary: Send SDK telemetry
      description: >-
        Public, no key; rate limited per session id and IP. At most 100 events and
        32 KB per call. Events are validated against the telemetry schema, and anything
        resembling media, tokens or landmark arrays is rejected. The body is JSON sent
        as `application/json`, or as `text/plain` so that `navigator.sendBeacon` can
        send it on page hide (D35). Responds with `Access-Control-Allow-Origin: *` and
        no credentials.
      security: []
      requestBody:
        description: The events, as JSON or as the same JSON sent as `text/plain`.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
            example:
              session_id: ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H
              sdk:
                platform: android
                name: dev.zakadi.sdk
                version: 1.4.2
                os: Android 13
                device: TECNO KI5
              events:
                - name: connect
                  t_ms: 1840
                  fields:
                    region: af-south-1
                    ms: 212
                - name: probe
                  t_ms: 3920
                  fields:
                    goodput_kbps: 820
                    rtt_ms: 190
                    start_rung: 2
          text/plain:
            schema:
              type: string
              description: A `TelemetryBatch` serialised as JSON.
              contentMediaType: application/json
              contentSchema:
                $ref: '#/components/schemas/TelemetryBatch'
            example: '{"session_id":"ses_01J8ZQ4XKD3M7V2N9B6T5R8W1H","sdk":{"platform":"web","name":"@zakadi/web-core","version":"1.4.2","os":"Android 13","browser":"Chrome 128"},"events":[{"name":"end","t_ms":41250,"fields":{"outcome":"completed","reason":"ok","duration_ms":37120}}]}'
      responses:
        '204':
          description: The events were accepted.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequestLimited'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalErrorLimited'

  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Control plane liveness
      description: Public, no key. Answers while the control plane is alive.
      security: []
      responses:
        '200':
          description: The control plane is alive.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
