  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Keys]
      summary: Get the JWKS
      description: >-
        Public, no key. The ES256 public keys, with `kid`, that verify `client_token`
        and `result_token`. Keys rotate every 90 days, and the previous key stays
        published for 30 days after a rotation. Clients never send the API key here.
      security: []
      responses:
        '200':
          description: The key set.
          headers:
            Zakadi-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                  - kty: EC
                    crv: P-256
                    kid: cp-2026-09
                    use: sig
                    alg: ES256
                    x: x8aW7uvxnW7tgIIzZ91pu4Gae-kF8ugUK9iDhwx7boM
                    y: YZK8ihiWvX536ipCq13f2156N6vjfxer5s2_2iN6uiY
                  - kty: EC
                    crv: P-256
                    kid: cp-2026-06
                    use: sig
                    alg: ES256
                    x: CPGe7Qm9V-upWx97AFj1JMtTd7al-DwXpe8bKuPRm54
                    y: dOQsaWOassglbKfXnU0Xy_f5GwbgQvj3Lf2TluRNrKA
        '500':
          $ref: '#/components/responses/InternalError'

webhooks:
  zakadi.session.completed:
    post:
      tags: [Webhooks]
      summary: A session has its verdict
      description: >-
        Sent to every active endpoint subscribed to the event. The receiver checks
        `Zakadi-Webhook-Signature` over `Zakadi-Webhook-Id`, `Zakadi-Webhook-Timestamp`
        and the raw body, and rejects a timestamp older than 300 s. Deliveries are at
