[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zakadi"
version = "0.0.1"
description = "Zakadi face-liveness API client for Python (pre-release): sessions, results, webhook and result-token verification, and the shared protocol constants."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Moses Gameli" }]
keywords = ["zakadi", "liveness", "biometrics", "identity-verification", "kyc"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.1",
]

[project.urls]
Homepage = "https://zakadi.dev"
Documentation = "https://docs.zakadi.dev"
Repository = "https://github.com/zakadihq/zakadi-python"
Issues = "https://github.com/zakadihq/zakadi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zakadi"]

[tool.hatch.build.targets.sdist]
include = ["src/zakadi", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "lefthook>=2.1.14",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
